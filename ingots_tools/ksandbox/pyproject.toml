[project]
name = "ksandbox"
version = "0.1.0"
description = "Reusable Docker sandbox with a Unix-socket daemon interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.0.0",
    "kexploit_utils",
    "pydantic>=2.11.5",
    "typer>=0.21.1",
]

[tool.uv.sources]
kexploit_utils = { workspace = true }

[tool.uv]
package = true

[tool.mypy]
mypy_path = "src"

[project.scripts]
ksandbox = "ksandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksandbox"]

[tool.hatch.build.targets.wheel.force-include]
"tool-bundle.Dockerfile" = "ksandbox/_tool_bundle/tool-bundle.Dockerfile"
"daemon/Cargo.toml" = "ksandbox/_tool_bundle/daemon/Cargo.toml"
"daemon/Cargo.lock" = "ksandbox/_tool_bundle/daemon/Cargo.lock"
"daemon/src/main.rs" = "ksandbox/_tool_bundle/daemon/src/main.rs"

[tool.hatch.build.targets.sdist]
include = [
    "src/ksandbox",
    "tool-bundle.Dockerfile",
    "daemon/Cargo.toml",
    "daemon/Cargo.lock",
    "daemon/src/main.rs",
    "README.md",
    "pyproject.toml",
]
